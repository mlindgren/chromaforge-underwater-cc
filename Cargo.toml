[package]
name = "underwater-cc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Underwater color correction as a Chromaforge pixel filter (PhotoCraft plug-in ABI v1, WebAssembly). Rust port of nikolajbech/underwater-image-color-correction."
readme = "README.md"
keywords = ["underwater", "color-correction", "wasm", "photo", "plugin"]
categories = ["multimedia::images"]
publish = false

[lib]
# cdylib: the .wasm module the host loads; rlib: lets the native tests call the algorithm directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Parsing the host's params JSON (incl. `_analysis`) and writing the measurement.
serde_json = "1"

[dev-dependencies]
# The Chromaforge filter host itself, to test the module exactly as the app runs it.
lcc-filters = { git = "https://github.com/emmertex/chromaforge", rev = "14b4099eadbe30adb9c7dfa7b56ab4e783f55a71" }
png = "0.17"
wasmparser = "0.239"

[workspace]
members = [".", "xtask"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The host's interpreter (wasmi) is far too slow unoptimised for whole-image tests.
[profile.dev.package."*"]
opt-level = 3
